name: aio-lint live

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public https site origin (e.g. https://example.com)
        required: true
        type: string
      strict:
        description: Fail the job when any layer status is fail
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  lint:
    name: aio-lint ${{ inputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint public site
        run: |
          set -euo pipefail
          args=(scripts/aio_lint.py "${{ inputs.url }}" --json)
          if [ "${{ inputs.strict }}" = "true" ]; then
            args+=(--strict)
          fi
          python3 "${args[@]}"
