name: aio-lint live

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public https site origin (e.g. https://example.com)
        required: true
        type: string
      strict:
        description: Fail the job when any layer status is fail
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  lint:
    name: aio-lint ${{ inputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Lint public site
        # Inputs reach the shell only as environment variables, never as script text.
        env:
          AIO_URL: ${{ inputs.url }}
          AIO_STRICT: ${{ inputs.strict }}
        run: |
          set -euo pipefail
          args=(scripts/aio_lint.py --json)
          if [ "$AIO_STRICT" = "true" ]; then
            args+=(--strict)
          fi
          python3 "${args[@]}" -- "$AIO_URL"
