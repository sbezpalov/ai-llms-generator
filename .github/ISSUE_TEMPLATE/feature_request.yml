name: Feature request
description: Propose a scoped improvement to the suite
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem is not covered today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or primary references
      description: Link current vendor or standards documentation where relevant.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: This proposal does not promise ranking, citation, or AI-answer inclusion.
          required: true
        - label: This proposal does not require private URLs or credentials.
          required: true
